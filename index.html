<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important} :root{color-scheme:light; padding-top:env(safe-area-inset-top,0px)} img{max-width:100%}</style>
<title>Tournée calendriers</title>
<meta name="apple-mobile-web-app-title" content="Calendriers">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#C4201A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Concept : plaques de numéro émaillées pour chaque maison, fond neutre, un seul rouge pompier pour les actions. Gros textes et grandes zones de tap pour l'extérieur, le soir, avec des gants. */
:root{
  --bg:#F4F2F2; --surface:#FFFFFF; --fg:#1E1A1A; --muted:#645C5C; --line:#DAD3D3;
  --accent:#C4201A; --on-accent:#FFFFFF;
  --ok:#1B7A3D; --on-ok:#FFFFFF; --warn:#9A5B00; --warn-bg:#FBEBCF; --off-bg:#E6E1E1; --mapbg:#EFEBE3; --road:#FFFFFF; --roadcase:#C8BEB2;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141111; --surface:#201B1B; --fg:#F4EFEF; --muted:#A89F9F; --line:#3B3333;
    --accent:#FF5B4E; --on-accent:#1A0705;
    --ok:#4FC47E; --on-ok:#06210F; --warn:#F2B24C; --warn-bg:#3A2A0C; --off-bg:#2E2828; --mapbg:#191616; --road:#3B3434; --roadcase:#4F4646;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141111; --surface:#201B1B; --fg:#F4EFEF; --muted:#A89F9F; --line:#3B3333;
  --accent:#FF5B4E; --on-accent:#1A0705;
  --ok:#4FC47E; --on-ok:#06210F; --warn:#F2B24C; --warn-bg:#3A2A0C; --off-bg:#2E2828; --mapbg:#191616; --road:#3B3434; --roadcase:#4F4646;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:400 17px/1.4 var(--font-body);
  max-width:640px; margin:0 auto;
  padding-block:14px 128px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1{font:700 32px/1 var(--font-display); text-transform:uppercase; letter-spacing:.02em; margin:0}
h2{font:700 25px/1.1 var(--font-display); text-transform:uppercase; letter-spacing:.03em; margin:24px 0 10px; text-wrap:balance}
.sub{color:var(--muted); font-size:15px; margin:4px 0 0}
.sync{color:var(--muted); font-size:13px; margin:6px 0 0; min-height:1.2em}
.sum{margin:8px 0 14px; color:var(--muted); font-size:16px}
.sum b{color:var(--fg); font-weight:600}

/* segmented controls */
.seg{display:flex; border:2px solid var(--fg); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg > *{flex:1; position:relative; min-width:0}
.seg button{width:100%; min-height:50px; border:0; background:transparent; font-weight:600; padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg)}
.sg input{position:absolute; opacity:0; width:1px; height:1px}
.sg span{display:grid; place-items:center; min-height:52px; font-weight:600; cursor:pointer; padding:0 6px}
.sg input:checked + span{background:var(--fg); color:var(--bg)}
.sg input:focus-visible + span{outline:3px solid var(--accent); outline-offset:-5px}
.seg > * + *{border-left:2px solid var(--fg)}
.seg.filter{margin:14px 0 6px}

/* rows */
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; min-height:66px; padding:10px 14px; margin:0 0 8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; text-align:left}
.row .rn{font:600 23px/1.1 var(--font-display); letter-spacing:.01em; min-width:0; overflow-wrap:anywhere}
.row .rn small{display:block; font:500 13px/1.3 var(--font-body); color:var(--muted); letter-spacing:0; margin-top:2px}
.row .rm{font-size:14px; color:var(--muted); text-align:right; flex:none; max-width:46%}
.row .rm b{display:block; color:var(--fg); font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
.empty{color:var(--muted); padding:18px 4px}

/* street view */
.back{min-height:48px; padding:0 14px 0 0; background:none; border:0; color:var(--accent); font-weight:600; font-size:17px}
.addn{display:flex; gap:8px; margin:0}
.addn input{flex:1; min-width:0}
.hint{color:var(--muted); font-size:14px; margin:6px 0 14px}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:14px; color:var(--muted); margin:0 0 12px}
.legend i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:-2px; margin-right:5px; border:2px solid var(--fg)}
.legend .l-vendu{background:var(--ok); border-color:var(--ok)}
.legend .l-repasse{background:var(--warn-bg); border:2px dashed var(--warn)}
.legend .l-refus{background:var(--off-bg); border-color:var(--muted)}
.plaques{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:10px}

/* plaque : numéro de maison émaillé */
.plaque{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  min-height:68px; padding:6px 4px; min-width:0;
  background:var(--surface); color:var(--fg);
  border:2px solid var(--fg); border-radius:9px;
  box-shadow:inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--fg);
}
.plaque b{font:700 28px/1 var(--font-display); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.plaque.long b{font-size:17px}
.plaque .sf{font:600 15px var(--font-body); margin-left:3px}
.plaque small{font-size:12px; font-weight:600; min-height:14px; font-variant-numeric:tabular-nums}
.plaque.st-vendu{background:var(--ok); color:var(--on-ok); border-color:var(--ok); box-shadow:inset 0 0 0 3px var(--ok), inset 0 0 0 4.5px var(--on-ok)}
.plaque.st-repasse{background:var(--warn-bg); color:var(--warn); border:2px dashed var(--warn); box-shadow:none}
.plaque.st-refus{background:var(--off-bg); color:var(--muted); border-color:var(--muted); box-shadow:none}
.plaque.st-refus b{text-decoration:line-through; text-decoration-thickness:3px}

/* forms */
input[type=text], input[type=search], select, textarea{
  width:100%; min-height:52px; padding:0 12px; font-size:20px; font-weight:500;
  background:var(--bg); border:2px solid var(--line); border-radius:10px; color:var(--fg);
}
input:focus, select:focus, textarea:focus{border-color:var(--accent); outline:none}
textarea{padding:10px 12px; font-family:inherit; resize:vertical}
.btn{min-height:52px; padding:0 18px; border-radius:10px; border:2px solid var(--fg); background:var(--surface); font-weight:600}
.btn.red{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.primary{width:100%; min-height:60px; margin-top:18px; border:0; border-radius:12px; background:var(--accent); color:var(--on-accent); font:700 26px var(--font-display); text-transform:uppercase; letter-spacing:.05em}
.ghost{flex:1; min-height:50px; border:2px solid var(--line); border-radius:10px; background:transparent; color:var(--muted); font-weight:600; padding:0 8px}
.ghost[data-armed]{border-color:var(--accent); color:var(--accent)}
details.add{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 14px}
details.add summary{min-height:54px; display:flex; align-items:center; font-weight:600; cursor:pointer}
details.add form{display:grid; gap:10px; padding:0 0 14px}

/* sheet */
#sheet{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; align-items:flex-end}
.panel{
  width:100%; max-width:560px; margin:0 auto; max-height:94%; overflow-y:auto;
  background:var(--surface); border-radius:18px 18px 0 0;
  padding-top:14px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.ph{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.ph .pl{flex:none; min-width:64px; max-width:110px; min-height:56px; display:grid; place-items:center; padding:0 10px; border:2px solid var(--fg); border-radius:9px; box-shadow:inset 0 0 0 3px var(--surface), inset 0 0 0 4.5px var(--fg); font:700 30px/1 var(--font-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ph .tt{flex:1; min-width:0; font:600 22px/1.15 var(--font-display); overflow-wrap:anywhere}
.ph .tt small{display:block; font:400 14px var(--font-body); color:var(--muted)}
.ph .x{flex:none; width:48px; height:48px; border:0; background:var(--bg); border-radius:50%; font-size:22px}
.fld{display:block; font-weight:600; margin:16px 0 6px}
.quick{display:flex; gap:8px; margin-top:8px}
.quick button{flex:1; min-height:48px; border:2px solid var(--line); border-radius:10px; background:var(--bg); font-weight:600; font-size:18px}
fieldset{border:0; padding:0; margin:16px 0 0}
legend{font-weight:600; padding:0; margin-bottom:6px}
.pays{display:grid; gap:8px}
.cb{position:relative; display:flex; align-items:center; gap:14px; min-height:58px; padding:0 14px; background:var(--bg); border:2px solid var(--line); border-radius:10px; cursor:pointer; font-size:19px; font-weight:500}
.cb input{position:absolute; opacity:0; width:1px; height:1px}
.cb .box{flex:none; width:34px; height:34px; display:grid; place-items:center; border:3px solid var(--fg); border-radius:6px; background:var(--surface); font:700 28px/1 var(--font-display); color:transparent}
.cb input:checked + .box{color:var(--accent)}
.cb:has(input:checked){border-color:var(--accent)}
.cb input:focus-visible + .box{outline:3px solid var(--accent); outline-offset:2px}
.err{color:var(--accent); font-weight:600; min-height:1.3em; margin:10px 0 0}
.dz{display:flex; gap:8px; margin-top:14px}

/* tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:5; display:grid; grid-template-columns:repeat(4,1fr); background:var(--surface); border-top:1px solid var(--line);
  padding:4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tabs button{min-height:58px; background:none; border:0; border-top:4px solid transparent; color:var(--muted); font:700 19px var(--font-display); text-transform:uppercase; letter-spacing:.03em}
.tabs button[aria-current="page"]{color:var(--accent); border-top-color:var(--accent)}

/* totals */
.big{margin:12px 0 0; padding:18px 16px; background:var(--surface); border:1px solid var(--line); border-radius:14px}
.big .lbl{font:600 18px var(--font-display); text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.big strong{display:block; font:700 64px/1 var(--font-display); color:var(--accent); font-variant-numeric:tabular-nums; margin:2px 0 4px}
.big span{color:var(--muted)}
.line{display:grid; grid-template-columns:1fr auto; gap:2px 12px; align-items:baseline; padding:12px 2px; border-bottom:1px solid var(--line)}
.line .n{font-weight:600; font-size:19px}
.line .n small{display:block; font-weight:400; font-size:14px; color:var(--muted)}
.line .v{font:700 26px var(--font-display); font-variant-numeric:tabular-nums; text-align:right}
.bar{grid-column:1 / -1; height:10px; background:var(--line); border-radius:5px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:16px}
th,td{padding:11px 6px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left; padding-left:0}
th{font:600 15px var(--font-body); color:var(--muted)}
tfoot td{font-weight:700; border-bottom:0}
.note{color:var(--muted); font-size:14px; margin:8px 0 0}
.exp{margin-top:18px; width:100%}

.btn[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.plaques.prune .plaque{outline:3px dashed var(--accent); outline-offset:-3px}
.lk{display:inline-flex; align-items:center; justify-content:center; min-height:52px; padding:0 14px; border:2px solid var(--fg); border-radius:10px; background:var(--surface); color:var(--fg); font-weight:600; text-decoration:none; text-align:center}
.lk.go{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.lks{display:flex; gap:8px; margin:12px 0 0}
.lks .lk{flex:1; min-width:0}
.mc{padding:12px 14px; margin:0 0 10px; background:var(--surface); border:1px solid var(--line); border-radius:12px}
.mc .rn{display:block; font:600 23px/1.1 var(--font-display); overflow-wrap:anywhere}
.mc .rn small{display:block; font:500 13px/1.3 var(--font-body); color:var(--muted); margin-top:2px}
.mapchips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.mapchips button{flex:none; min-height:44px; padding:0 14px; border:2px solid var(--line); border-radius:999px; background:var(--surface); font-weight:600; font-size:15px; white-space:nowrap}
.mapchips button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.mapbox{position:relative; aspect-ratio:6/5; max-width:100%; background:var(--mapbg); border:2px solid var(--fg); border-radius:12px; overflow:hidden}
#mapsvg{display:block; width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none}
.mapcredit{position:absolute; left:6px; bottom:4px; font-size:11px; background:var(--mapbg); color:var(--muted); padding:1px 6px; border-radius:6px}
.mapcredit a{color:inherit}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapimg{filter:brightness(.72) saturate(.85)}}
:root[data-theme="dark"] .mapimg{filter:brightness(.72) saturate(.85)}
.mapzoom{position:absolute; top:8px; right:8px; display:grid; gap:6px}
.mapzoom button{width:48px; height:48px; border:2px solid var(--fg); border-radius:10px; background:var(--surface); font:700 26px/1 var(--font-display)}
.mdot.libre{fill:var(--surface); stroke:var(--fg)}
.mdot.vendu{fill:var(--ok); stroke:var(--ok)}
.mdot.repasse{fill:var(--warn-bg); stroke:var(--warn)}
.mdot.refus{fill:var(--off-bg); stroke:var(--muted)}
.rcase{fill:none; stroke:var(--roadcase); stroke-linecap:round; stroke-linejoin:round}
.road{fill:none; stroke:var(--road); stroke-linecap:round; stroke-linejoin:round}
.mlab{fill:var(--fg); stroke:var(--mapbg); paint-order:stroke; stroke-linejoin:round; font-family:var(--font-body); font-weight:600}
.mstr{fill:var(--muted); stroke:var(--mapbg); paint-order:stroke; stroke-linejoin:round; font-family:var(--font-body); font-weight:700; text-anchor:middle; cursor:pointer}
.msc{stroke:var(--fg)}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:30; background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-weight:600; max-width:90%}
@media (prefers-reduced-motion:no-preference){ .panel{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}} }
header{position:relative; padding-right:64px}
.menubtn{position:absolute; top:8px; right:0; width:56px; height:56px; display:grid; place-items:center; border:2px solid var(--line); border-radius:50%; background:var(--surface); color:var(--fg)}
#tname{overflow-wrap:anywhere}
.mi{display:block; width:100%; min-height:58px; margin:0 0 8px; padding:0 16px; text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:12px; font-weight:600; font-size:18px}
.sep{border:0; border-top:1px solid var(--line); margin:14px 0}
.qrbox{width:min(78vw,300px); margin:6px auto 12px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px; aspect-ratio:1; display:grid; place-items:center}
.qrbox svg{width:100%; height:100%; display:block}
.code{font:700 30px var(--font-display); letter-spacing:.06em; text-align:center; margin:0 0 6px; user-select:all}
.err{color:var(--accent); font-weight:600; min-height:1.2em; margin:8px 0 0}
#scanbox{margin-top:12px} #scanbox video{width:100%; border-radius:12px; background:#000; max-height:46vh; object-fit:cover}
input[type=text]{width:100%}
.chips2{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.chip2{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 6px 0 14px; border:2px solid var(--accent); border-radius:22px; font-weight:600}
.chip2 button{width:36px; height:36px; border:0; background:none; font-size:18px}
.mi.danger{color:var(--accent); border-color:var(--accent)}
#splash{position:fixed; inset:0; z-index:100; background:#C4201A; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .45s ease; padding:24px}
#splash.out{opacity:0; pointer-events:none}
#splash img{border-radius:28px; box-shadow:0 8px 30px rgba(0,0,0,.35)}
#splash .sp-t{text-align:center; font:700 26px var(--font-display); text-transform:uppercase; letter-spacing:.05em; margin:22px 0 0}
#splash .sp-b{position:absolute; left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); text-align:center; font-size:14px; margin:0; opacity:.9}
@media (prefers-reduced-motion:no-preference){#splash img{animation:pop .6s ease-out}@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="icon-192.png" alt="" width="132" height="132"><p class="sp-t">Tournée calendriers</p><p class="sp-b">Créé par Noah Fournier · v3.4</p></div>

<header>
  <button type="button" class="menubtn" data-a="menu" aria-label="Menu des tournées"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="4.5" r="2.4" fill="currentColor"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><circle cx="12" cy="19.5" r="2.4" fill="currentColor"/></svg></button>
  <h1 id="tname">Tournée calendriers</h1>
  <p class="sub">Calendriers des pompiers · v3.4</p>
  <p class="sync" id="sync" role="status"></p>
</header>
<main id="main"></main>
<nav class="tabs" aria-label="Menu">
  <button type="button" data-a="tab" data-v="tournee">Tournée</button>
  <button type="button" data-a="tab" data-v="ventes">Ventes</button>
  <button type="button" data-a="tab" data-v="totaux">Totaux</button>
  <button type="button" data-a="tab" data-v="carte">Carte</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='tournee-calendriers-v1';
var VILLAGES=['Crevans','La Chapelle'];
var PAY={especes:'Espèces',cheque:'Chèque'};
var STAT={vendu:'Vendu',repasse:'Repasse',refus:'Refus'};
function slug(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
var RUES=['Rue de Corcelles','Rue de Gémonval','Rue de la Berette','Rue de la Fontaine','Rue des 3 Fontaines','Rue des Blanchards','Rue des Champs Gresons','Rue des Grands Prés','Rue des Oiches','Impasse de Dravillars','Impasse des Grands Champs','Impasse des Oiches','Impasse des Prés Neufs','Chemin des Vignes','Grand Pré','Les Prés Neufs','Village de Crevans','La Chapelle'];

    var cfg={}, re=/(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)\s*:\s*["']([^"']+)["']/g, m;
    while((m=re.exec(txt))){if(!cfg[m[1]])cfg[m[1]]=m[2];}
    if(!cfg.apiKey||!cfg.projectId||/REMPLACE CE TEXTE/.test(txt))return false;

function joinCode(raw){

    var code=normCode(raw);

    if(tourOf(code)){setCur(code); return res(code);}
    if(!fs)return rej('La synchronisation n\'est pas activée dans cette appli.');
    docRef(code).get().then(function(s){
      if(!s.exists)return rej('Code inconnu. Vérifie les lettres et les chiffres.');
      var d=s.data()||{}; if(d.supprime){T.left=T.left.filter(function(x){return x.code!==code;}); lsSet('left',T.left); return rej('Cette tournée a été supprimée.');} var lf=T.left.filter(function(x){return x.code===code;})[0]; T.list.push({code:code,nom:d.nom||(lf&&lf.nom)||'Tournée',owner:!!(lf&&lf.owner)}); T.left=T.left.filter(function(x){return x.code!==code;}); lsSet('left',T.left); lsSet('list',T.list); loadT(code); subscribe(code); setCur(code); res(code);
    }).catch(function(){rej('Impossible de vérifier le code. Vérifie ta connexion.');});
  });
}

  T.list=T.list.filter(function(t){return t.code!==code;}); lsSet('list',T.list);
  try{localStorage.removeItem(LS+'t:'+code);}catch(e){} delete cache[code]; closeSheet();
  if(T.cur===code){var n=T.list[0]; if(n)setCur(n.code); else{T.cur=null; lsSet('cur',null); state.ventes={}; state.config=defCfg(); applyGeo(null); render();}} else render();
  toast(msg||'Tournée quittée');
}
function deleteTour(code){
  var t=tourOf(code); if(!t||!t.owner)return;
  if(!fs){leaveTour(code,'Tournée supprimée',true); return;}
  toast('Suppression…');
  docRef(code).set({supprime:true},{merge:true}).then(function(){return colRef(code).get();}).then(function(snap){
    return Promise.all(snap.docs.map(function(d){return colRef(code).doc(d.id).delete();}));
  }).then(function(){leaveTour(code,'Tournée supprimée pour tout le monde',true);}).catch(function(){toast('Suppression impossible : vérifie ta connexion');});
}

  if(v&&v.readyState>=2&&v.videoWidth){var cv=$('#scancv'), w=Math.min(480,v.videoWidth), h=Math.round(v.videoHeight*w/v.videoWidth); cv.width=w; cv.height=h;
    var cx=cv.getContext('2d',{willReadFrequently:true}); cx.drawImage(v,0,0,w,h); var im=cx.getImageData(0,0,w,h), res=window.jsQR&&window.jsQR(im.data,w,h,{inversionAttempts:'dontInvert'});

  var key=z+'/'+r.x0+'/'+r.x1+'/'+r.y0+'/'+r.y1; if(key===mp.tk)return null; mp.tk=key;

var DBG=[], VERSION='3.4';
function fetchJ(url,ms){var c=new AbortController(), t=setTimeout(function(){c.abort();},ms||15000); return fetch(url,{signal:c.signal}).then(function(r){clearTimeout(t); if(!r.ok){DBG.push(url.split('?')[0].replace('https://','')+' → http '+r.status); throw new Error('http'+r.status);} return r;},function(e){clearTimeout(t); DBG.push(url.split('?')[0].replace('https://','')+' → '+((e&&(e.message||e.name))||'erreur')); throw e;});}
function searchCommunes(q){return fetchJ('https://geo.api.gouv.fr/communes?nom='+encodeURIComponent(q)+'&codeDepartement=70&fields=nom,code,centre,codesPostaux&boost=population&limit=8',10000).then(function(r){return r.json();});}
function csvCtx(code){return {h:null,out:[],code:code};}
function csvLine(line,x){
  if(!line)return; var c=line.split(';');
  if(!x.h){var hd=c.map(function(s){return s.replace(/^"|"$/g,'').trim().toLowerCase();});
    function f(a){for(var i=0;i<a.length;i++){var k=hd.indexOf(a[i]); if(k>-1)return k;} return -1;}
    x.h={v:f(['nom_voie','voie_nom']),n:f(['numero']),r:f(['rep','suffixe']),lo:f(['lon','long']),la:f(['lat']),c:f(['code_insee','commune_insee'])};
    if(x.h.v<0||x.h.n<0||x.h.lo<0||x.h.la<0)throw new Error('format'); return;}
  if(line.indexOf(x.code)<0)return;
  var H=x.h; if(H.c>-1&&c[H.c].replace(/"/g,'')!==x.code)return;
  var num=parseInt(c[H.n],10), lat=parseFloat(c[H.la]), lon=parseFloat(c[H.lo]), v=(c[H.v]||'').replace(/^"|"$/g,'').trim();
  if(!v||!(num>0&&num<9000)||!isFinite(lat)||!isFinite(lon))return;
  var rep=H.r>-1?(c[H.r]||'').replace(/"/g,'').trim():''; x.out.push({v:v,n:normNum(num+(rep?' '+rep:'')),lat:lat,lon:lon});
}
function banCommune(url,code,ms){
  return fetchJ(url,ms).then(function(res){var x=csvCtx(code); return res.text().then(function(t){t.split(/\r?\n/).forEach(function(l){csvLine(l,x);}); if(!x.h)throw new Error('vide'); return x.out;});});
}
function banDep(code){
  var dep=code.slice(0,2), url='https://adresse.data.gouv.fr/data/ban/adresses/latest/csv/adresses-'+dep+'.csv.gz';
  if(!window.DecompressionStream||!window.TextDecoderStream)return Promise.reject(new Error('nostream'));
  return fetch(url).then(function(res){
    if(!res.ok||!res.body)throw new Error('http'+res.status);
    var rd=res.body.pipeThrough(new DecompressionStream('gzip')).pipeThrough(new TextDecoderStream()).getReader(), x=csvCtx(code), buf='';
    function pump(){return rd.read().then(function(r){
      if(r.done){csvLine(buf,x); return x.out;}
      buf+=r.value; var i=buf.lastIndexOf('\n'); if(i>-1){buf.slice(0,i).split('\n').forEach(function(l){csvLine(l.replace(/\r$/,''),x);}); buf=buf.slice(i+1);}
      return pump();});}
    return pump();});
}
var GEOC=['https://data.geopf.fr/geocodage/search/','https://api-adresse.data.gouv.fr/search/'];
function geoQ(q,code,type,lim){
  function at(i){return fetchJ(GEOC[i]+'?q='+encodeURIComponent(q)+'&citycode='+code+'&type='+type+'&limit='+lim,12000).then(function(r){return r.json();}).catch(function(e){if(i+1<GEOC.length)return at(i+1); throw e;});}
  return at(0).then(function(j){return j.features||[];});
}
function banApi(code){
  var out=[], names={}, fails=0;
  function pool(list,fn,n){var i=0; function w(){if(i>=list.length)return Promise.resolve(); return fn(list[i++]).then(w);} var ws=[]; for(var k=0;k<n;k++)ws.push(w()); return Promise.all(ws);}
  function addHN(f){var p=f.properties||{}, g=f.geometry&&f.geometry.coordinates; if(!g||!p.street||!p.housenumber)return; names[norm(p.street)]=p.street; out.push({v:p.street,n:normNum(String(p.housenumber).replace(/^(\d+)(bis|ter|quater)$/i,'$1 $2')),lat:g[1],lon:g[0]});}
  var seeds=['rue','chemin','impasse','route','allee','place','lotissement','les','la','le','du','de','des','sur','aux','en','pres','grande','petite','haut','bas','pont','eglise','mairie','1','2','3','4','5','6','7','8','9'];
  return pool(seeds,function(q){return geoQ(q,code,'street',50).then(function(l){l.forEach(function(f){var p=f.properties||{}; var nm=p.street||p.name; if(nm)names[norm(nm)]=nm;});}).catch(function(){fails++;});},4)
  .then(function(){return pool(seeds.slice(0,9),function(q){return geoQ(q,code,'housenumber',50).then(function(l){l.forEach(addHN);}).catch(function(){fails++;});},4);})
  .then(function(){var list=Object.keys(names).map(function(k){return names[k];}); return pool(list,function(nm){return geoQ(nm,code,'housenumber',50).then(function(l){l.forEach(addHN);}).catch(function(){fails++;});},5);})
  .then(function(){if(!out.length)throw new Error('vide'); out.partial=true; return out;});
}
function loadAddresses(code){
  return banCommune('https://plateforme.adresse.data.gouv.fr/ban/communes/'+code+'/download/csv-bal/adresses',9000,code)
   .then(function(a){if(!a.length)throw 0; return a;})
   .catch(function(){return banDep(code).then(function(a){if(!a.length)throw 0; return a;});})
   .catch(function(){return banApi(code);});
}
var ROAD_RE=/^(rue|chemin|impasse|route|all[ée]e|avenue|place|voie|passage|ruelle|cour|sentier|lotissement|r[ée]sidence|boulevard|quai|square|cit[ée]|zone|zac|promenade|pont|rond|parvis|carrefour|faubourg|grand[\s-]?rue|ancien|petite rue|vieux chemin|petit chemin)\b/i;
function buildGeo(communes,lists){
  var streets=[],pts={},seen={},lat=0,lon=0,n=0,ids={};
  communes.forEach(function(c,ci){(lists[ci]||[]).forEach(function(a){
    var key=c.code+'|'+norm(a.v), id=seen[key];
    if(!id){var base=slug(a.v)||'rue', id0=base+(communes.length>1?'-'+c.code:''), k=1; id=id0; while(ids[id]){id=id0+'-'+(++k);} ids[id]=1; seen[key]=id; streets.push({id:id,nom:a.v,g:ROAD_RE.test(a.v)?'r':'l',v:c.nom}); pts[id]={};}
    if(!pts[id][a.n]){pts[id][a.n]=[Math.round(a.lat*1e6)/1e6,Math.round(a.lon*1e6)/1e6]; lat+=a.lat; lon+=a.lon; n++;}});});
  streets.sort(function(a,b){return a.nom.localeCompare(b.nom,'fr');});
  var ctr=n?[lat/n,lon/n]:[communes[0].lat,communes[0].lon];
  return {communes:communes.map(function(c){return{nom:c.nom,code:c.code,cp:c.cp||''};}),streets:streets,pts:pts,c:ctr};
}

    +'</tbody><tfoot><tr><td>Total</td><td>'+eur(byPay.especes)+'</td><td>'+eur(byPay.cheque)+'</td><td>'+eur(grand)+'</td></tr></tfoot></table></div>';
  if(byPay.nd>0)html+='<p class="note">Une partie des ventes n\'a pas de moyen de paiement coché ('+eur(byPay.nd)+'). Elle compte dans le total mais pas dans les colonnes.</p>';
  html+='<h2>Sauvegarde</h2><button type="button" class="btn exp" data-a="export">Exporter les ventes (tableur)</button><button type="button" class="btn exp" data-a="backup" style="margin-top:10px">Sauvegarder toutes mes données</button><label class="btn exp" for="restore" style="margin-top:10px;display:flex;align-items:center;justify-content:center;cursor:pointer">Restaurer une sauvegarde</label><input type="file" id="restore" accept=".json,application/json" style="position:absolute;opacity:0;width:1px;height:1px"><p class="note">Tes ventes sont enregistrées sur ce téléphone seulement. Fais une sauvegarde de temps en temps et garde le fichier en lieu sûr.</p>';
  return html;
}

/* ---------- fiche de vente ---------- */
function openSheet(street,num){
  var id=rid(street,num), r=state.ventes[id], s=streetById(street), st=r?r.statut:'vendu';
  S={id:id,rue:street,numero:num};
  var q=addrQ(street,num);
  var varRow=/^\d+$/.test(String(num))?'<p class="hint" style="margin:0 0 6px">Ajouter à la liste de cette rue :</p><div class="quick" style="margin:0 0 14px">'+['bis','ter','A','B'].map(function(sf){return '<button type="button" data-a="addvar" data-v="'+esc(num+' '+sf)+'">'+esc(num)+' '+sf+'</button>';}).join('')+'</div>':'';
  var pays=Object.keys(PAY).map(function(k){return '<label class="cb"><input type="checkbox" name="pay" value="'+k+'"'+(r&&r.paiement===k?' checked':'')+'><span class="box">✕</span><span>'+PAY[k]+'</span></label>';}).join('');
  var radios=Object.keys(STAT).map(function(k){return '<label class="sg"><input type="radio" name="st" value="'+k+'"'+(st===k?' checked':'')+'><span>'+STAT[k]+'</span></label>';}).join('');
  $('#sheet').innerHTML='<div class="panel" role="dialog" aria-modal="true" aria-label="Fiche de vente">'
   +'<div class="ph"><div class="pl">'+esc(num)+'</div><div class="tt">'+esc(s?s.nom:'')+'<small>'+villageOf(street)+'</small></div><button type="button" class="x" data-a="close" aria-label="Fermer">✕</button></div>'
   +'<div class="lks" style="margin:0 0 14px"><a class="lk go" href="'+esc(wazeUrl(q))+'" target="_blank" rel="noopener">Y aller avec Waze</a><a class="lk" href="'+esc(mapUrl(q))+'" target="_blank" rel="noopener">Plan</a></div>'
   +varRow
   +'<div class="seg" role="radiogroup" aria-label="Résultat du passage">'+radios+'</div>'
   +'<div id="vf"'+(st==='vendu'?'':' hidden')+'>'
   +'<label class="fld" for="f-nom">Nom de l\'acheteur</label><input type="text" id="f-nom" autocomplete="off" value="'+esc(r?r.nom:'')+'">'
   +'<label class="fld" for="f-mont">Montant (€)</label><input type="text" id="f-mont" inputmode="decimal" autocomplete="off" value="'+(r&&r.montant!=null?String(r.montant).replace('.',','):'')+'">'
   +'<div class="quick"><button type="button" data-a="amt" data-v="5">5</button><button type="button" data-a="amt" data-v="10">10</button><button type="button" data-a="amt" data-v="15">15</button><button type="button" data-a="amt" data-v="20">20</button></div>'
   +'<fieldset><legend>Paiement</legend><div class="pays">'+pays+'</div></fieldset></div>'
   +'<p class="err" id="err" role="alert"></p>'
   +'<button type="button" class="primary" data-a="save">Enregistrer</button>'
   +'<div class="dz">'+(r?'<button type="button" class="ghost" data-a="reset">Remettre à vide</button>':'')+'<button type="button" class="ghost" data-a="remove">Retirer ce numéro</button></div></div>';
  $('#sheet').hidden=false; document.body.classList.add('lock');
  if(st==='vendu'&&!r)setTimeout(function(){var e=$('#f-nom'); if(e)e.focus();},60);
}
function closeSheet(){stopScan(); $('#sheet').hidden=true; $('#sheet').innerHTML=''; document.body.classList.remove('lock'); S=null;}
function parseAmount(v){var n=parseFloat(String(v).replace(',','.').replace(/[^\d.]/g,'')); return isFinite(n)&&n>0?Math.round(n*100)/100:null;}
function saveSheet(){
  if(!S)return; var st=document.querySelector('#sheet input[name=st]:checked').value, s=streetById(S.rue);
  var rec={id:S.id,rue:S.rue,rueNom:s?s.nom:'',numero:S.numero,statut:st,nom:'',montant:null,paiement:'',ts:Date.now()};
  if(st==='vendu'){
    var m=parseAmount($('#f-mont').value);
    if(m==null){$('#err').textContent='Indique le montant payé.'; $('#f-mont').focus(); return;}
    rec.nom=$('#f-nom').value.trim(); rec.montant=m;
    var p=document.querySelector('#sheet input[name=pay]:checked'); rec.paiement=p?p.value:'';
  }
  putVente(rec); closeSheet(); toast('Enregistré');
}
function armed(btn){if(btn.dataset.armed)return true; btn.dataset.armed='1'; btn.dataset.old=btn.textContent; btn.textContent='Touche encore pour confirmer';
  setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed; btn.textContent=btn.dataset.old;}},3500); return false;}
var tt=null;
function toast(t){var e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(tt); tt=setTimeout(function(){e.hidden=true;},2200);}

function addNumbers(text,sid){
  state.config.hidden=state.config.hidden||{};
  var id=sid||state.street, cur=(state.config.numeros[id]||[]).slice(), have={}, hid=(state.config.hidden[id]||[]).slice(); streetNums(id).forEach(function(n){have[n]=1;});
  var add=[]; text.split(/[,;\n]+/).forEach(function(p){p=normNum(p); if(!p)return;
    var m=p.match(/^(\d{1,3})\s*(?:-|–|à|a)\s*(\d{1,3})$/);
    if(m&&+m[2]>=+m[1]&&+m[2]-+m[1]<=300){for(var i=+m[1];i<=+m[2];i++)add.push(String(i));}
    else add.push(p.slice(0,24));});
  var n=0; add.forEach(function(x){if(!have[x]){have[x]=1; var hi=hid.indexOf(x); if(hi>-1)hid.splice(hi,1); else cur.push(x); n++;}});
  if(!n){toast('Déjà dans la liste'); return;}
  state.config.numeros[id]=cur; state.config.hidden[id]=hid; putCfg(); toast(pl(n,'numéro ajouté','numéros ajoutés'));
  setTimeout(function(){var e=$('#newnum'); if(e)e.focus();},30);
}
function saveFile(name,text,mime){
  if(downloads)return downloads.save({filename:name,data:text}).then(function(){toast('Fichier enregistré');},function(e){if(!e||e.code!=='declined')toast('Export impossible ici');});
  var blob=new Blob([text],{type:mime}), file=null;
  try{file=new File([blob],name,{type:mime});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))return navigator.share({files:[file],title:name}).catch(function(){});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1500); return Promise.resolve();
}
function exportCsv(){
  var rows=[['Village','Rue','Numéro','Nom','Montant','Paiement','Date']];
  Object.keys(state.ventes).map(function(k){return state.ventes[k];}).filter(function(r){return r.statut==='vendu';}).sort(function(a,b){return (a.ts||0)-(b.ts||0);}).forEach(function(r){
    var s=streetById(r.rue); rows.push([villageOf(r.rue),s?s.nom:r.rueNom,r.numero,r.nom,String(r.montant==null?'':r.montant).replace('.',','),PAY[r.paiement]||'',new Date(r.ts||Date.now()).toLocaleDateString('fr-FR')]);});
  var csv='﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  saveFile('calendriers-ventes.csv',csv,'text/csv');
}

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]'); if(!t){if(e.target.id==='sheet')closeSheet(); return;}
  var a=t.dataset.a;
  if(a==='tab'){if(state.view===t.dataset.v&&state.view==='tournee')state.street=null; state.prune=false; state.view=t.dataset.v; closeSheet(); render(); window.scrollTo(0,0);}
  else if(a==='mapdot'){if(!mp.moved)openSheet(t.dataset.s,t.dataset.n);}
  else if(a==='mapzoom'){if(mp.moved)return; var zid=t.dataset.id||null; mp.sel=zid; mp.vb=zid?streetVB(zid):fullVB(); render();}
  else if(a==='mapin'||a==='mapout'){var v0=mp.vb||fullVB(); mp.vb=v0; mapZoom(a==='mapin'?.5:2, v0[0]+v0[2]/2, v0[1]+v0[3]/2); mapDraw();}
  else if(a==='street'){state.street=t.dataset.id; state.prune=false; render(); window.scrollTo(0,0);}
  else if(a==='back'){state.street=null; state.prune=false; render(); window.scrollTo(0,0);}
  else if(a==='filter'){state.filter=t.dataset.v; render();}
  else if(a==='setvillage'){state.config.villages[state.street]=t.dataset.v; putCfg();}
  else if(a==='chip'){
    if(state.prune){var num=t.dataset.n;
      if(state.ventes[rid(state.street,num)])toast('Déjà utilisé : ouvre-le pour le retirer');
      else{hideNum(state.street,num); putCfg();}}
    else openSheet(state.street,t.dataset.n);}
  else if(a==='prune'){state.prune=!state.prune; render();}
  else if(a==='quickadd')addNumbers(t.dataset.v);
  else if(a==='addvar'&&S)addNumbers(t.dataset.v,S.rue);
  else if(a==='rec'){var r=state.ventes[t.dataset.id]; if(r)openSheet(r.rue,r.numero);}
  else if(a==='close')closeSheet();
  else if(a==='menu')menuPanel();
  else if(a==='pickc'){var cc={nom:t.dataset.nom,code:t.dataset.code,lat:parseFloat(t.dataset.lat),lon:parseFloat(t.dataset.lon),cp:t.dataset.cp}; if(!NT.sel.some(function(x){return x.code===cc.code;}))NT.sel.push(cc); $('#nt-q').value=''; $('#nt-res').innerHTML=''; ntRefresh();}
  else if(a==='unpickc'){NT.sel=NT.sel.filter(function(x){return x.code!==t.dataset.code;}); ntRefresh();}
  else if(a==='newempty'){NT.sel=[]; $('#nt-q').value=''; submitNew();}
  else if(a==='presetcrev'){var lg=legacy, cd=createTour('Crevans et La Chapelle',null); if(lg){var c0=loadT(cd); c0.ventes=lg.ventes; c0.cfg=Object.assign(defCfg(),lg.config); useT(cd); saveT(cd); if(fs)Object.keys(c0.ventes).forEach(function(k){putVente(c0.ventes[k]);}); putCfg(); render(); legacy=null;} setTimeout(sharePanel,250);}
  else if(a==='newt')newPanel();
  else if(a==='join'){joinPanel();}
  else if(a==='scan')startScan();
  else if(a==='switch'){setCur(t.dataset.code);}
  else if(a==='share')sharePanel();
  else if(a==='rues')ruesPanel();
  else if(a==='rename')renamePanel();
  else if(a==='me')mePanel();
  else if(a==='allrues'){state.config.rues=null; putCfg(); ruesPanel();}
  else if(a==='norues'){state.config.rues=[]; putCfg(); ruesPanel();}
  else if(a==='leave'){if(armed(t))leaveTour(T.cur);}
  else if(a==='comeback'){joinCode(t.dataset.code).then(function(){toast('Tournée retrouvée');},function(m){toast(m); menuPanel();});}
  else if(a==='delete'){if(armed(t))deleteTour(T.cur);}
  else if(a==='copycode'){var ct=tourOf(T.cur); if(ct){var txt=fmtCode(ct.code); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Code copié');},function(){toast('Code : '+txt);});}}
  else if(a==='sharecode'){var st2=tourOf(T.cur); if(st2){var msg='Rejoins la tournée « '+st2.nom+' » : code '+fmtCode(st2.code)+' '+shareUrl(st2.code); if(navigator.share)navigator.share({title:'Tournée calendriers',text:msg}).catch(function(){}); else if(navigator.clipboard)navigator.clipboard.writeText(msg).then(function(){toast('Lien copié');});}}
  else if(a==='save')saveSheet();
  else if(a==='amt'){$('#f-mont').value=t.dataset.v; $('#err').textContent='';}
  else if(a==='reset'){if(armed(t)){delVente(S.id); closeSheet(); toast('Remis à vide');}}
  else if(a==='remove'){if(armed(t)){var id=S.rue,num=S.numero; hideNum(id,num); var rid2=S.id; if(state.ventes[rid2])delVente(rid2); putCfg(); closeSheet(); toast('Numéro retiré');}}
  else if(a==='export')exportCsv();
  else if(a==='backup')saveFile('calendriers-sauvegarde.json',JSON.stringify({v:1,config:state.config,ventes:state.ventes}),'application/json');
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-f]'); if(!f)return; e.preventDefault();
  if(f.dataset.f==='newt'){submitNew();}
  else if(f.dataset.f==='join'){takeMe(); showJoinErr(''); var jc=$('#jn-code').value; doJoin(jc);}
  else if(f.dataset.f==='rename'){var rn=$('#rn-nom').value.trim(); var tt2=tourOf(T.cur); if(rn&&tt2){tt2.nom=rn.slice(0,40); lsSet('list',T.list); var cc=T.cur; cloudDo(function(){return docRef(cc).set({nom:tt2.nom},{merge:true});}); drawHeader(); closeSheet(); toast('Renommée');}}
  else if(f.dataset.f==='me'){var mv=$('#me-nom').value.trim().slice(0,30); T.me=mv; lsSet('me',mv); closeSheet(); toast('Enregistré');}
  else if(f.dataset.f==='addnum'){var v=$('#newnum').value.trim(); if(v){addNumbers(v); $('#newnum').value='';}}
  else if(f.dataset.f==='addlist'){var lt=$('#paste').value.trim(); if(lt){addNumbers(lt); $('#paste').value='';}}
  else if(f.dataset.f==='addstreet'){var nom=$('#ns-nom').value.trim(); if(!nom)return;
    var id='c-'+Date.now().toString(36); state.config.custom.push({id:id,nom:nom.slice(0,60),g:'r'}); state.config.villages[id]=$('#ns-v').value; putCfg(); toast('Rue ajoutée');}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.dataset&&t.dataset.a==='rue'){toggleRue(t.dataset.id,t.checked); return;}
  if(t.name==='pay'&&t.checked)document.querySelectorAll('#sheet input[name=pay]').forEach(function(x){if(x!==t)x.checked=false;});
  if(t.name==='st'){$('#vf').hidden=t.value!=='vendu';}
});
document.addEventListener('input',function(e){if(e.target.id==='nt-q')ntSearch(e.target.value); if(e.target.id==='nt-nom')NT.edited=true; if(e.target.id==='q'){state.q=e.target.value; $('#vlist').innerHTML=rowsVentes();}});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender){var a=document.activeElement; if(!(a&&a.matches&&a.matches('#main input, #main select, #main textarea'))){pendingRender=false; render();}}},50);});
document.addEventListener('change',function(e){
  if(e.target.id!=='restore'||!e.target.files||!e.target.files[0])return;
  var fr=new FileReader();
  fr.onload=function(){try{var j=JSON.parse(fr.result); if(!j||typeof j.ventes!=='object'||j.ventes===null)throw 0;
    if(!T.cur)throw 0; Object.keys(j.ventes).forEach(function(k){var r=fixRec(j.ventes[k]); if(r&&r.id&&(!state.ventes[k]||(state.ventes[k].ts||0)<=(r.ts||0)))putVente(r);}); toast('Sauvegarde restaurée');}catch(x){toast('Fichier de sauvegarde non reconnu');}};
  fr.readAsText(e.target.files[0]); e.target.value='';
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();});

init();
setTimeout(function(){var sp=document.getElementById('splash'); if(sp){sp.classList.add('out'); setTimeout(function(){sp.remove();},600);}},1800);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
})();
